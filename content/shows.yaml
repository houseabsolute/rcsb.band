# Our shows. Add a new one by copying a block (from the "- date" line down to the blank line) and
# changing the details. The order doesn't matter, the site sorts them by date.
#
# Old shows move to "Past shows" on their own, so you never need to delete them.
#
#   date:    Required. Year-month-day, like 2026-11-15
#   venue:   Required. Where we're playing.
#   city:    Optional. Like "Minneapolis, MN"
#   time:    Optional. Any text, like "Doors 7pm, show 8pm"
#   with:    Optional. Other bands on the bill.
#   tickets: Optional. A link to buy tickets.
#   notes:   Optional. Anything else, like "All ages" or "Free!"

